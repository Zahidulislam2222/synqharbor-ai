name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://synqharbor.zahidul-islam.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --audit-level=low
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pipx run --spec semgrep==1.168.0 semgrep scan --error --config p/security-audit --metrics=off src tests
      - run: pipx run --spec bandit==1.9.4 bandit -q -ll -r scripts backend/app backend/runner backend/migrations infra/backend
      - run: pipx run --spec semgrep==1.168.0 semgrep scan --error --config p/security-audit --metrics=off backend/app backend/runner
      # Derived from the existing machine security CI template.
      # Bandit also covers the local control-plane and isolated runner implementation.
      # Optional paid AI review remains disabled; no provider API key is configured.
      # Standard public-repository runners only; no artifact-storage uploads.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: test-key
          POSTGRES_DB: synqharbor_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app runner migrations tests ../infra/backend
      - run: mypy app ../infra/backend
      - run: pytest -q
      - name: Prepare isolated PostgreSQL parity configuration
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect("postgresql://postgres:test-key@localhost:5432/synqharbor_test_ci", autocommit=True) as db:
              db.execute("CREATE ROLE synqharbor_test_runtime LOGIN PASSWORD 'test-key' NOSUPERUSER NOBYPASSRLS")
          Path(os.environ["RUNNER_TEMP"], "synqharbor-postgres.json").write_text(json.dumps({
              "migration_url": "postgresql+psycopg://postgres:test-key@localhost:5432/synqharbor_test_ci",
              "runtime_url": "postgresql+psycopg://synqharbor_test_runtime:test-key@localhost:5432/synqharbor_test_ci"}))
          PY
      - run: pytest -c pyproject.toml -q tests --database-test-config "${{ runner.temp }}/synqharbor-postgres.json"
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q app runner migrations
      # Test providers only. Real local-model/gVisor qualification is a separate local gate.
